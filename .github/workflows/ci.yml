name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Type check
        run: corepack yarn type-check

      - name: Lint
        run: corepack yarn lint

      - name: Format check
        run: corepack yarn format:check

      - name: Build
        run: corepack yarn build

      - name: Run fast tests
        run: corepack yarn test

      # These tests install live packages with npm, pnpm, yarn, and Bun. Their
      # results depend on registry state, package-manager availability, and
      # platform-specific bundle output, so they should inform PRs without
      # making deterministic unit and build checks permanently red.
      - name: Run slow integration tests (non-blocking)
        run: corepack yarn test:slow
        continue-on-error: true

      - name: Run tests with coverage (Node 24 only)
        if: matrix.node-version == '24.x'
        run: corepack yarn test:coverage
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: matrix.node-version == '24.x'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-check:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build
        run: corepack yarn build

      - name: Check build artifacts
        run: |
          if [ ! -d "build" ]; then
            echo "Build directory not found"
            exit 1
          fi
          if [ ! -f "build/index.js" ]; then
            echo "Build output not found"
            exit 1
          fi
